# NUCLEO-F401RE (clone) with onboard SEGGER J-Link OB instead of ST-Link
# USB: 1366:0105 SEGGER J-Link (serial 000778745417)
source [find interface/jlink.cfg]

transport select swd
adapter speed 2000

source [find target/stm32f4x.cfg]

# The clone J-Link OB corrupts the SWD link at 4 MHz during flash programming
# (DPIDR glitches 0x2ba01477 -> 0x4ba01477, programming fails). Cap the SWD
# clock in every reset phase, otherwise stm32f4x.cfg's reset-init event raises
# it back to 8000 kHz when 'program' runs its internal reset halt.
$_TARGETNAME configure -event reset-start { adapter speed 2000 }
$_TARGETNAME configure -event reset-init  { adapter speed 2000 }
